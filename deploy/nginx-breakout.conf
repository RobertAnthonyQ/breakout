server {
    listen 80;
    listen [::]:80;
    server_name rocky.breakout.lat;

    auth_basic "Rocky Breakout";
    auth_basic_user_file /etc/nginx/.htpasswd-breakout;

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }

    location = /api/integrations/google/callback {
        auth_basic off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3100;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3100;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.breakout.lat;

    root /srv/breakout-assets;
    location / {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
